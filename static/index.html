<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora AI Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar">
            <button class="new-chat-btn" id="newChatBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                New chat
            </button>
            <div class="conversation-list" id="conversationList"></div>
        </aside>

        <div class="main-panel">
            <header class="header">
                <div class="header-content">
                    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 6H21M3 12H21M3 18H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    </button>
                    <div class="brand">
                        <div class="brand-icon">N</div>
                        <div>
                            <h1>Nexora</h1>
                            <span class="brand-sub">AI Assistant</span>
                        </div>
                    </div>
                    <div class="status">
                        <span class="status-dot"></span>
                        <span>Online</span>
                    </div>
                </div>
            </header>

            <main class="chat-container">
                <div class="chat-messages" id="chatMessages"></div>

                <div class="typing-indicator hidden" id="typingIndicator">
                    <div class="avatar avatar-bot">N</div>
                    <div class="typing-bubble">
                        <div class="typing-dots"><span></span><span></span><span></span></div>
                    </div>
                </div>

                <div class="chat-input-wrap">
                    <div class="chat-input">
                        <textarea id="messageInput" placeholder="Message Nexora..." rows="1"></textarea>
                        <button id="sendBtn" aria-label="Send">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                                <path d="M3 11L21 3L13 21L11 13L3 11Z" fill="currentColor"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
