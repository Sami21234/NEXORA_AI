<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="analytics.css">
</head>
<body>
    <div class="dash-shell">
        <header class="header">
            <div class="header-content">
                <a href="/" class="sidebar-toggle" aria-label="Back to chat">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </a>
                <div class="brand">
                    <div class="brand-icon">N</div>
                    <div>
                        <h1>Analytics</h1>
                        <span class="brand-sub">Real numbers from logged messages</span>
                    </div>
                </div>
            </div>
        </header>

        <main class="dash-content" id="dashContent">
            <p class="dash-loading">Loading analytics...</p>
        </main>
    </div>

    <script src="analytics.js"></script>
</body>
</html>
